name: Update sento data

# Every Monday 03:00 in Japan, refresh data/sento/ from OpenStreetMap.
# Also runnable by hand: GitHub → Actions → Update sento data → Run workflow.
on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download sento from OpenStreetMap
        run: python3 tools/build_sento_data.py

      - name: Commit and republish if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update sento data from OpenStreetMap"
          git push
          # Pushes made by this workflow don't rebuild GitHub Pages on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
