<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sento</title>
  <meta name="description" content="Plan and track sento visits together.">
  <meta name="theme-color" content="#89CFF0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sento">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <button class="avatars" id="avatars" data-action="profiles" aria-label="Profile photos"></button>
      <div>
        <h1>Sento</h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <button class="weather" id="weather" data-action="weather" hidden></button>
    <button class="icon-btn" data-action="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span id="sync-dot" data-s="off" aria-hidden="true"></span>
    </button>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="go">
      <svg viewBox="0 0 24 24"><path d="M7 13a5 5 0 1 0 10 0"/><path d="M9.5 13c-1-1.2 1-2.4 0-3.6s1-2.4 0-3.6M14.5 13c-1-1.2 1-2.4 0-3.6s1-2.4 0-3.6"/></svg>
      <span>Should we go?</span>
    </button>
    <button data-tab="sentos">
      <svg viewBox="0 0 24 24"><path d="M2.5 11 12 4.5l9.5 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-4.5h5V20"/><path d="M16.5 6.4V2.5h2.2v5.4"/><path d="M8 12.5h1.5M14.5 12.5H16"/></svg>
      <span>Sento</span>
    </button>
    <button data-tab="diary">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7l1.5-2.5h4L15.5 7"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      <span lang="ja">さっぱり</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>History</span>
    </button>
  </nav>

  <dialog id="sheet"><form method="dialog" id="sheet-form" novalidate></form></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
